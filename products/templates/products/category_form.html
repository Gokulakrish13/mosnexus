{% extends 'products/base.html' %}
{% block content %}
    <style>
        /* Base styles */
        body, html {
            margin: 0; padding: 0;
            font-size: 1rem;
            color: #222;
            background: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
                Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            height: 100%;
        }

        /* Form background & center */
        .form-bg {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f8;
            padding-top: 56px; /* offset for fixed top bar */
            box-sizing: border-box;
        }

        /* Form container */
        .form-container {
            background: #fff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.07);
            border-radius: 12px;
            padding: 3rem 2.5rem 2.5rem;
            max-width: 440px;
            width: 95vw;
            box-sizing: border-box;
            transition: box-shadow 0.3s ease;
        }
        .form-container:hover {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        }

        /* Heading */
        .form-container h2 {
            margin: 0 0 1.75rem 0;
            font-size: 2rem;
            font-weight: 600;
            color: #005fa3;
            text-align: center;
            letter-spacing: 0.03em;
        }

        /* Labels */
        label {
            display: block;
            margin-top: 1.25rem;
            font-weight: 600;
            color: #444;
            user-select: none;
        }

        /* Inputs */
        input[type="text"] {
            width: 100%;
            padding: 0.75rem 0.85rem;
            margin-top: 0.5rem;
            border: 1.5px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            background: #f8fafc;
            color: #222;
            transition: border-color 0.25s ease;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            border-color: #005fa3;
            outline: none;
            background: #fff;
            box-shadow: 0 0 6px rgba(0, 95, 163, 0.4);
        }

        /* Button */
        button[type="submit"] {
            margin-top: 2rem;
            width: 100%;
            padding: 0.9rem 0;
            background-color: #005fa3;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            font-size: 1.15rem;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(0, 95, 163, 0.35);
            transition: background-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
            user-select: none;
        }
        button[type="submit"]:hover,
        button[type="submit"]:focus {
            background-color: #004072;
            box-shadow: 0 10px 25px rgba(0, 64, 114, 0.55);
            transform: translateY(-3px);
            outline: none;
        }

        /* Messages */
        .messages {
            list-style: none;
            padding: 0.75rem 1rem;
            margin: 0 0 1rem 0;
            border-radius: 6px;
            background-color: #ffe6e6;
            color: #a70000;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1.5px solid #d8000c;
            user-select: none;
        }
        .messages li + li {
            margin-top: 0.5rem;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .form-container {
                padding: 2.5rem 1.5rem 2rem;
                max-width: 90vw;
            }
            h2 {
                font-size: 1.75rem;
            }
            button[type="submit"] {
                font-size: 1.05rem;
                padding: 0.75rem 0;
            }
        }
    </style>
    <div class="form-bg">
        <div class="form-container">
            <a href="{% url 'category_list_stream' stream %}" style="display:block;margin-bottom:1.2rem;color:#005fa3;font-weight:600;text-decoration:underline;">&larr; Back to List</a>
            <h2>{% if edit %}Edit Category{% else %}Add Category{% endif %}</h2>

            {% if messages %}
                <ul class="messages" role="alert" aria-live="assertive">
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}

            <form method="post" novalidate>
                {% csrf_token %}
                <label for="name">Category Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ category.name|default:'' }}"
                    autocomplete="off"
                    spellcheck="false"
                    required
                >

                <label for="serial_number">Serial Number:</label>
                <input
                    type="text"
                    id="serial_number"
                    name="serial_number"
                    value="{{ category.serial_number|default:'' }}"
                    autocomplete="off"
                    spellcheck="false"
                    required
                >

                <button type="submit">{% if edit %}Update Category{% else %}Add Category{% endif %}</button>
            </form>
        </div>
    </div>
    <script>
      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
      });
    </script>
{% endblock %}
