{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Changed - IGT Mobile Surgery Portal</title>
    <meta name="description" content="Password Successfully Changed">
    <link rel="icon" type="image/png" href="{% static 'products/philips.png' %}" />
    
    <!-- Google Fonts for modern professional look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --primary-solid: #667eea;
            --success: #26de81;
            --bg-light: #f8fafc;
            --bg-dark: #0f1419;
            --glass: rgba(255,255,255,0.95);
            --glass-dark: rgba(15,20,25,0.95);
            --card-bg: rgba(255,255,255,0.8);
            --card-bg-dark: rgba(30,41,59,0.8);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-primary-dark: #f1f5f9;
            --text-secondary-dark: #94a3b8;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --radius: 20px;
            --radius-lg: 32px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --border: 1px solid rgba(148, 163, 184, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            transition: var(--transition);
            overflow-x: hidden;
        }

        body.dark-mode {
            background: var(--bg-dark);
            color: var(--text-primary-dark);
        }

        /* Animated Background */
        .bg-animated {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 219, 226, 0.3) 0%, transparent 50%);
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(180%);
            border-bottom: var(--border);
            padding: 1rem 2rem;
            transition: var(--transition);
        }

        body.dark-mode .header {
            background: var(--glass-dark);
            border-bottom: 1px solid rgba(51, 65, 85, 0.3);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--primary-solid);
        }

        .header-logo img {
            width: 32px;
            height: 32px;
        }

        /* Main Container */
        .main-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 2rem 2rem;
        }

        .success-container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 2rem;
            border: var(--border);
            box-shadow: var(--shadow-lg);
            max-width: 500px;
            width: 100%;
            text-align: center;
            animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        body.dark-mode .success-container {
            background: var(--card-bg-dark);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2rem;
            color: white;
            box-shadow: var(--shadow);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(38, 222, 129, 0.7);
            }
            70% {
                transform: scale(1.05);
                box-shadow: 0 0 0 10px rgba(38, 222, 129, 0);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(38, 222, 129, 0);
            }
        }

        .success-title {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--success);
            margin-bottom: 0.5rem;
        }

        .success-message {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 1.25rem;
            font-weight: 500;
        }

        body.dark-mode .success-message {
            color: var(--text-secondary-dark);
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary {
            background: var(--card-bg);
            color: var(--text-primary);
            border: var(--border);
        }

        body.dark-mode .btn-secondary {
            background: var(--card-bg-dark);
            color: var(--text-primary-dark);
        }

        .btn-secondary:hover {
            background: var(--primary-solid);
            color: white;
            transform: translateY(-2px);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-container {
                padding: 80px 1rem 1rem;
            }

            .success-container {
                padding: 1.5rem;
            }

            .success-title {
                font-size: 1.5rem;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <!-- Animated Background -->
    <div class="bg-animated"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="header-logo">
                <img src="{% static 'products/Philips_NoBG.png' %}" alt="Philips" />
                <span>IGT MoS Portal</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container">
        <div class="success-container">
            <div class="success-icon">
                <i class="fas fa-check"></i>
            </div>
            <h1 class="success-title">Password Changed!</h1>
            <p class="success-message">Your password has been updated successfully. You can now use your new password to sign in.</p>
            
            <div class="action-buttons">
                <a href="/users/profile/{{ user.id }}/" class="btn btn-primary">
                    <i class="fas fa-user"></i>
                    Back to Profile
                </a>
                <a href="/dashboard/" class="btn btn-secondary">
                    <i class="fas fa-tachometer-alt"></i>
                    Go to Dashboard
                </a>
            </div>
        </div>
    </main>

    <script>
        // Auto redirect after 5 seconds
        setTimeout(() => {
            window.location.href = '/users/profile/{{ user.id }}/';
        }, 5000);

        // Prevent right-click
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // Add keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                window.location.href = '/users/profile/{{ user.id }}/';
            }
        });
    </script>
</body>
</html>
