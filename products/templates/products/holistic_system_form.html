<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if edit %}Edit{% else %}Add{% endif %} Holistic System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(120deg, #e0e7ef 0%, #f8fafc 100%);
            min-height: 100vh;
        }
        .card {
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,95,163,0.08);
            margin-top: 3rem;
        }
        .card-header {
            background: linear-gradient(135deg, #005fa3 0%, #003d6b 100%);
            color: white;
            border-radius: 16px 16px 0 0;
            padding: 2rem 1.5rem 1.5rem 1.5rem;
        }
        .form-label {
            font-weight: 600;
            color: #005fa3;
        }
        .btn-primary {
            background: #005fa3;
            border: none;
        }
        .btn-primary:hover {
            background: #003d6b;
        }
        .btn-secondary {
            background: #6c757d;
            border: none;
        }
        .btn-secondary:hover {
            background: #495057;
        }
        .required-star { color: #dc3545; }
    </style>
</head>
<body>
<div class="container">
    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">
                <i class="fas fa-{% if edit %}edit{% else %}plus{% endif %} me-2"></i>
                {% if edit %}Edit System{% else %}Add New System{% endif %}
            </h3>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="row g-3">
                    <!-- Core Information -->
                    <div class="col-12">
                        <h5 class="border-bottom pb-2 mb-3">Core Information</h5>
                    </div>
                    
                    <div class="col-md-4">
                        <label class="form-label">Serial Number <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="sr_no" 
                               value="{{ system.sr_no }}" required>
                    </div>
                    
                    <div class="col-md-4">
                        <label class="form-label">System Availability <span class="text-danger">*</span></label>
                        <select class="form-select" name="system_availability" required>
                            {% for value, label in status_choices %}
                            <option value="{{ value }}" {% if system.system_availability == value %}selected{% endif %}>
                                {{ label }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-4">
                        <label class="form-label">Priority</label>
                        <select class="form-select" name="priority">
                            <option value="low" {% if system.priority == 'low' %}selected{% endif %}>Low</option>
                            <option value="medium" {% if system.priority == 'medium' %}selected{% endif %}>Medium</option>
                            <option value="high" {% if system.priority == 'high' %}selected{% endif %}>High</option>
                            <option value="critical" {% if system.priority == 'critical' %}selected{% endif %}>Critical</option>
                        </select>
                    </div>
                    
                    <!-- System Details -->
                    <div class="col-12 mt-4">
                        <h5 class="border-bottom pb-2 mb-3">System Details</h5>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label">Allocation to Sl No</label>
                        <input type="text" class="form-control" name="allocation_to_sl_no" 
                               value="{{ system.allocation_to_sl_no }}">
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label">Location Info</label>
                        <input type="text" class="form-control" name="location_info" 
                               value="{{ system.location_info }}">
                    </div>
                    
                    <div class="col-md-4">
                        <label class="form-label">STMi Number</label>
                        <input type="text" class="form-control" name="stmi_number" 
                               value="{{ system.stmi_number }}">
                    </div>
                    
                    <div class="col-md-4">
                        <label class="form-label">System Owner</label>
                        <input type="text" class="form-control" name="system_owner" 
                               value="{{ system.system_owner }}">
                    </div>
                    
                    <div class="col-md-4">
                        <label class="form-label">ECR Number</label>
                        <input type="text" class="form-control" name="ecr_number" 
                               value="{{ system.ecr_number }}">
                    </div>
                    
                    <div class="col-md-12">
                        <label class="form-label">Test Engineer</label>
                        <input type="text" class="form-control" name="test_engineer" 
                               value="{{ system.test_engineer }}">
                    </div>
                    
                    <!-- Additional Information -->
                    <div class="col-12 mt-4">
                        <h5 class="border-bottom pb-2 mb-3">Additional Information</h5>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" name="description" rows="3">{{ system.description }}</textarea>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label">Notes</label>
                        <textarea class="form-control" name="notes" rows="3">{{ system.notes }}</textarea>
                    </div>
                </div>
                
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="fas fa-save me-2"></i>
                        {% if edit %}Update System{% else %}Create System{% endif %}
                    </button>
                    <a href="{% url 'holistic_dashboard' %}" class="btn btn-secondary btn-lg">
                        <i class="fas fa-times me-2"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
