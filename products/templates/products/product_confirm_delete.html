<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Delete Product{% endblock %}</title>
    <link rel="stylesheet" href="/static/products/style.css">
    <style>
        /* Removed forced font-family styling. Only keep color, font-size, and .top-bar style. */
        body, html {
            color: #222;
            font-size: 1rem;
            background: #fff;
        }
        .top-bar {
            color: #222;
            font-size: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.7rem 2.5rem;
            background: #fff;
            border-bottom: 1px solid #e0e3e7;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            box-sizing: border-box;
            z-index: 1000;
        }
        body {
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }
        .delete-bg {
            background: url('/static/products/background.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .delete-container {
            background: rgba(255,255,255,0.85);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.10);
            border-radius: 16px;
            padding: 2.5rem 2rem 2rem 2rem;
            max-width: 420px;
            width: 95vw;
            margin: 60px auto 0 auto;
            text-align: center;
        }
        .delete-container h2 {
            margin-bottom: 1rem;
            font-size: 2rem;
            color: #dc3545;
        }
        .delete-container p {
            color: #333;
            margin-bottom: 2rem;
        }
        .delete-btn, .cancel-btn {
            padding: 0.6rem 1.5rem;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: 500;
            text-decoration: none;
            margin: 0 0.7rem;
            border: none;
            cursor: pointer;
        }
        .delete-btn {
            background: #dc3545;
            color: #fff;
        }
        .delete-btn:hover {
            background: #a71d2a;
        }
        .cancel-btn {
            background: #6c757d;
            color: #fff;
        }
        .cancel-btn:hover {
            background: #495057;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <!-- Top bar content, if any -->
    </div>
    <div class="delete-bg">
        <div class="delete-container">
            <h2>Delete Product</h2>
            <p>Are you sure you want to delete <strong>{{ product.name }}</strong>?</p>
            <form method="post" style="display:inline;">
                {% csrf_token %}
                <input type="hidden" name="query_params" value="{{ query_params }}">
                <button type="submit" class="delete-btn">Delete</button>
            </form>
            <a href="{% url 'product_list_stream' stream %}{% if query_params %}?{{ query_params }}{% endif %}" class="cancel-btn">Cancel</a>
        </div>
    </div>
    <script>
      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
      });
    </script>
</body>
</html>
