{% extends 'products/base.html' %}
{% block title %}Delete Location{% endblock %}
{% block content %}
<div class="form-bg" style="background:#f4f6f8;min-height:100vh;display:flex;justify-content:center;align-items:center;">
    <div class="form-container" style="background:#fff;box-shadow:0 8px 32px rgba(0,95,163,0.13);border-radius:18px;padding:2.5rem;width:98%;max-width:480px;animation:fadeIn 0.5s ease-in-out;">
        <a href="{% url 'location_list_stream' stream %}" style="display:block;margin-bottom:1.2rem;color:#005fa3;font-weight:600;text-decoration:underline;font-size:1.08rem;">&larr; Back to List</a>
        <h2 style="font-size:2rem;font-weight:900;color:#dc3545;letter-spacing:0px;margin-bottom:2rem;">Delete Location</h2>
        <p style="font-size:1.13rem;color:#333;margin-bottom:2rem;">Are you sure you want to delete the location <strong style="color:#005fa3;">{{ location.name }}</strong>?</p>
        <form method="post" style="display:flex;gap:1.2rem;align-items:center;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger" style="font-size:1.13rem;padding:0.9rem 2rem;border-radius:8px;font-weight:700;">Delete</button>
            <a href="{% url 'location_list_stream' stream %}" class="btn btn-warning" style="font-size:1.13rem;padding:0.9rem 2rem;border-radius:8px;font-weight:700;">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
