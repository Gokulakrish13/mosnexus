# ─────────────────────────────────────────────────────────────────────────────
# NexusOps – Nginx Production Configuration (HTTP-only, IP access)
# ─────────────────────────────────────────────────────────────────────────────
# Place at: /etc/nginx/sites-available/mosnexus
# Symlink:  sudo ln -s /etc/nginx/sites-available/mosnexus /etc/nginx/sites-enabled/
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name 16.171.6.113;

    client_max_body_size 50M;

    # ── Static Files (served by Nginx directly) ──────────────────
    location /static/ {
        alias /home/ubuntu/mosnexus/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Media Files ──────────────────────────────────────────────
    location /media/ {
        alias /home/ubuntu/mosnexus/product_images/;
    }

    # ── Application (proxy to Gunicorn Unix socket) ──────────────
    location / {
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn.sock;
    }
}